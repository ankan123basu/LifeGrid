services:
  mongodb:
    image: mongo:7.0
    container_name: lifegrid-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: lifegrid_db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "rs.status().ok || rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
